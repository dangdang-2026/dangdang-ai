[project]
name = "dangdang-ai"
version = "0.1.0"
description = "당당 AI 서버 — Spring이 부르는 음식 후보·진료 메모 정리 보조 (FastAPI)"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.143.2",
    "numpy>=2.4.6",
    "onnxruntime>=1.31.1",
    "pillow>=13.0.0",
    "pydantic-settings>=2.16.0",
    "python-multipart>=0.0.33",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
train = [
    "onnx>=1.23.2",
    "onnxscript>=0.7.2",
    "timm>=1.0.31",
    "torch>=2.15.0",
    "torchvision>=0.29.2",
]
